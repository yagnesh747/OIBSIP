<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game — Handcrafted Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fafaf9;
            --card-bg: #ffffff;
            --card-border: #e7e5e4;
            --primary-green: #14532d;
            --secondary-green: #166534;
            --accent-orange: #f97316;
            --accent-green: #15803d;
            --accent-red: #dc2626;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --input-bg: #f5f5f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        h1 { font-size: 1.6rem; font-weight: 700; color: var(--primary-green); letter-spacing: -0.02em; }
        p { color: var(--text-sub); font-size: 0.875rem; margin-top: 4px; }

        .diff-select { display: flex; gap: 10px; margin: 20px 0; justify-content: center; }
        .diff-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .diff-btn.active { background: var(--primary-green); color: #ffffff; border-color: var(--primary-green); }

        .input-group { margin: 20px 0; }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus { border-color: var(--accent-orange); background: #ffffff; }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: var(--accent-orange);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #ea580c; }

        .btn-sub {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }
        .btn-sub:hover { background: #e7e5e4; }

        .feedback {
            margin: 20px 0;
            padding: 14px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: left;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎯 Number Guessing Game</h1>
    <p>Oasis Infobyte Java Internship — Task 2</p>

    <div class="diff-select">
        <button class="diff-btn active" onclick="setDiff('EASY')">Easy (1-50)</button>
        <button class="diff-btn" onclick="setDiff('MEDIUM')">Medium (1-100)</button>
        <button class="diff-btn" onclick="setDiff('HARD')">Hard (1-200)</button>
    </div>

    <div class="feedback" id="feedback">Click 'Start Game' to begin guessing!</div>

    <div class="input-group">
        <input type="number" id="guess" placeholder="Enter your guess">
        <button class="btn" onclick="makeGuess()">Submit Guess</button>
        <button class="btn btn-sub" onclick="newGame()">New Game</button>
    </div>

    <div class="stats">
        <div>Played: <strong id="s-played" style="color:var(--text-main)">0</strong></div>
        <div>Won: <strong id="s-won" style="color:var(--accent-green)">0</strong></div>
        <div>High Score: <strong id="s-high" style="color:var(--accent-orange)">0 pts</strong></div>
        <div>Attempts Left: <strong id="s-left" style="color:var(--primary-green)">0</strong></div>
    </div>
</div>

<script>
    const diffs = { EASY: { min: 1, max: 50, att: 10, mult: 1.0 }, MEDIUM: { min: 1, max: 100, att: 7, mult: 1.5 }, HARD: { min: 1, max: 200, att: 5, mult: 2.5 } };
    let curDiff = 'EASY', target = 0, remaining = 0, played = 0, won = 0, highScore = 0, active = false;

    function setDiff(d) {
        curDiff = d;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        newGame();
    }

    function newGame() {
        const cfg = diffs[curDiff];
        target = Math.floor(Math.random() * (cfg.max - cfg.min + 1)) + cfg.min;
        remaining = cfg.att;
        active = true;
        document.getElementById('feedback').innerText = `Guess a number between ${cfg.min} and ${cfg.max}`;
        document.getElementById('feedback').style.color = 'var(--text-main)';
        document.getElementById('s-left').innerText = remaining;
    }

    function makeGuess() {
        if (!active) return newGame();
        const g = parseInt(document.getElementById('guess').value);
        const cfg = diffs[curDiff];
        if (isNaN(g) || g < cfg.min || g > cfg.max) return alert(`Enter a number between ${cfg.min} and ${cfg.max}`);

        remaining--;
        document.getElementById('s-left').innerText = remaining;

        if (g === target) {
            active = false; played++; won++;
            const score = Math.round((500 + remaining * 100) * cfg.mult);
            if (score > highScore) highScore = score;
            document.getElementById('feedback').innerText = `🏆 BINGO! Correct Number! Score: ${score} pts`;
            document.getElementById('feedback').style.color = 'var(--accent-green)';
        } else if (remaining <= 0) {
            active = false; played++;
            document.getElementById('feedback').innerText = `❌ Game Over! The number was ${target}`;
            document.getElementById('feedback').style.color = 'var(--accent-red)';
        } else {
            const hint = g > target ? 'Too High! Try Lower' : 'Too Low! Try Higher';
            document.getElementById('feedback').innerText = `${hint} (${remaining} attempts left)`;
            document.getElementById('feedback').style.color = 'var(--accent-orange)';
        }

        document.getElementById('s-played').innerText = played;
        document.getElementById('s-won').innerText = won;
        document.getElementById('s-high').innerText = highScore + ' pts';
        document.getElementById('guess').value = '';
    }
    newGame();
</script>
</body>
</html>
